name: Assessment System Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'planventure-ta-assessment/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'planventure-ta-assessment/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
        
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('planventure-ta-assessment/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
        
      - name: Install dependencies
        working-directory: planventure-ta-assessment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-flask pytest-cov flake8 black isort
        
      - name: Lint with flake8
        working-directory: planventure-ta-assessment
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
      - name: Check code formatting with black
        working-directory: planventure-ta-assessment
        run: |
          black --check --diff .
        continue-on-error: true
        
      - name: Check import sorting with isort
        working-directory: planventure-ta-assessment
        run: |
          isort --check-only --diff .
        continue-on-error: true
        
      - name: Initialize database
        working-directory: planventure-ta-assessment
        run: |
          python init_db.py
        
      - name: Run unit tests with coverage
        working-directory: planventure-ta-assessment
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
        
      - name: Run specific DELETE endpoint tests
        working-directory: planventure-ta-assessment
        run: |
          python -m pytest tests/test_delete_endpoint_unit.py -v
        
      - name: Run comprehensive error handling tests
        working-directory: planventure-ta-assessment
        run: |
          python -m pytest tests/test_error_handling_comprehensive.py -v
        
      - name: Run integration tests
        working-directory: planventure-ta-assessment
        run: |
          python -m pytest tests/ -k "integration" -v
        continue-on-error: true
        
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: planventure-ta-assessment/coverage.xml
          directory: planventure-ta-assessment/
          flags: assessment-system
          name: codecov-umbrella
        continue-on-error: true
        
      - name: Archive test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            planventure-ta-assessment/htmlcov/
            planventure-ta-assessment/coverage.xml
            planventure-ta-assessment/pytest.ini

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          
      - name: Check for security vulnerabilities in dependencies
        working-directory: planventure-ta-assessment
        run: |
          pip install -r requirements.txt
          safety check
        continue-on-error: true
        
      - name: Run bandit security scan
        working-directory: planventure-ta-assessment
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt
        continue-on-error: true
        
      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan-results
          path: planventure-ta-assessment/bandit-report.json

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        working-directory: planventure-ta-assessment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-benchmark locust
          
      - name: Initialize database
        working-directory: planventure-ta-assessment
        run: |
          python init_db.py
          
      - name: Run performance tests
        working-directory: planventure-ta-assessment
        run: |
          python -m pytest tests/ -k "performance" -v --benchmark-only
        continue-on-error: true

  api-documentation:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        working-directory: planventure-ta-assessment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flasgger
          
      - name: Generate API documentation
        working-directory: planventure-ta-assessment
        run: |
          # This would generate Swagger/OpenAPI docs if configured
          echo "API documentation generation placeholder"
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [test, security-scan, performance-test, api-documentation]
    if: always()
    
    steps:
      - name: Notify on success
        if: ${{ needs.test.result == 'success' }}
        run: |
          echo "✅ All assessment system tests passed successfully!"
          
      - name: Notify on failure
        if: ${{ needs.test.result == 'failure' }}
        run: |
          echo "❌ Assessment system tests failed. Please check the logs."
          exit 1
